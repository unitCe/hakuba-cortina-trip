
name: Deploy Hakuba Trip Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # GitHubからソースコードを取得
      - name: Checkout
        uses: actions/checkout@v4

      # Node.jsを準備
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # パッケージをインストール
      - name: Install dependencies
        run: npm ci

      # React/Viteサイトをビルド
      - name: Build
        run: npm run build

      # GitHub Pagesの設定
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # distフォルダをアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # GitHub Pagesへ公開
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
